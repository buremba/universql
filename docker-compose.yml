version: '3.8'

services:
  universql:
    build: .
    image: universql:latest
    ports:
      - "5432:5432"    # PostgreSQL protocol
      - "8084:8084"    # FastAPI/WebSocket
    environment:
      - SERVER_HOST=0.0.0.0
      - POSTGRESQL_PORT=5432
      - API_PORT=8084
      - USE_LOCALCOMPUTING_COM=1
      - MAX_MEMORY=80%
      - MAX_CACHE_SIZE=80%
      - HOME_DIRECTORY=/tmp
      - CACHE_DIRECTORY=/tmp/.universql/cache
      - FRONTEND_DIR=/app/dist
    command: ["postgresql", "--host", "0.0.0.0", "--port", "5432", "--api-port", "8084"]
    volumes:
      - universql_cache:/tmp/.universql/cache
      - ./dist:/app/dist:ro  # Mount local frontend build if available
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - universql-network

  # Optional: Add a PostgreSQL database for testing
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    ports:
      - "5433:5432"  # Different port to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - universql-network
    profiles:
      - with-postgres  # Optional service

volumes:
  universql_cache:
  postgres_data:

networks:
  universql-network:
    driver: bridge 